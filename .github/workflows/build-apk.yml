# ============================================================================
# build-apk.yml — Compilación automática del APK con GitHub Actions
# ----------------------------------------------------------------------------
# Cada vez que subes código a la rama "main", un servidor de GitHub:
#   1) descarga tu código, 2) instala Java y Flutter, 3) genera la carpeta
#   android/, 4) compila el APK, 5) lo publica en "Releases" con un link fijo:
#   https://github.com/<usuario>/avatar-app/releases/latest/download/avatar-app.apk
# ============================================================================
name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch: # botón "Run workflow" para compilar a mano

permissions:
  contents: write # necesario para crear el Release

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Flutter (estable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generar la carpeta android/ (si no existe)
        run: flutter create --platforms=android --org com.yordanni --project-name avatar_app .

      - name: Permisos de internet y nombre de la app
        run: python3 tool/patch_android.py

      - name: Descargar paquetes
        run: flutter pub get

      - name: Revisar el código
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Compilar APK de release
        run: flutter build apk --release

      - name: Renombrar APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk avatar-app.apk
          ls -lh avatar-app.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Avatar App v1.0.${{ github.run_number }}
          body: APK de la app "Avatar - La Leyenda de Aang" (Tarea 5, Desarrollo Móvil, ITLA).
          files: avatar-app.apk
          make_latest: true

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: avatar-app-apk
          path: avatar-app.apk
